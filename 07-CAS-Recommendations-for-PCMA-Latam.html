<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ixtapa-Zihuatanejo CAS Recommendations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: screen-share deck on one scroll; big thesis, dated sequence, three large ranked cards that open detail modals, four next steps */
:root {
  --bg: #eef3f3; --surface: #ffffff; --ink: #11232a; --muted: #56686f; --line: #d3dfe1;
  --accent: #0d6a75; --accent-soft: #dcecee; --strike: #9aa9ae; --scrim: rgba(10, 24, 28, 0.55);
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d181c; --surface: #142328; --ink: #e5eef0; --muted: #9db1b7; --line: #263a40;
    --accent: #55bac6; --accent-soft: #17343a; --strike: #5d7177; --scrim: rgba(0, 0, 0, 0.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d181c; --surface: #142328; --ink: #e5eef0; --muted: #9db1b7; --line: #263a40;
  --accent: #55bac6; --accent-soft: #17343a; --strike: #5d7177; --scrim: rgba(0, 0, 0, 0.7);
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 18px; line-height: 1.45; }
body.locked { overflow: hidden; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 32px 56px; display: grid; gap: 48px; }
h1, h2, h3 { font-family: var(--display); font-stretch: 85%; text-wrap: balance; margin: 0; line-height: 1.05; }
h1 { font-size: clamp(2.4rem, 6.5vw, 4.4rem); font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 750; }
h3 { font-size: clamp(1.4rem, 3vw, 1.9rem); font-weight: 750; }
p { margin: 0; }
.eyebrow { font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

header { display: grid; gap: 18px; }
.meta { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); }
.thesis { font-family: var(--display); font-stretch: 85%; font-weight: 600; font-size: clamp(1.3rem, 3vw, 1.8rem); line-height: 1.2; color: var(--accent); max-width: 30ch; }

/* sequence */
.seq { display: grid; gap: 16px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.step { background: var(--surface); border: 1px solid var(--line); border-top: 5px solid var(--accent); border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; align-content: start; }
.step .date { font-family: var(--mono); font-size: 0.8rem; color: var(--accent); font-variant-numeric: tabular-nums; }
.step .what { font-family: var(--display); font-stretch: 85%; font-weight: 700; font-size: 1.2rem; line-height: 1.15; }

/* cards */
.recs { display: grid; gap: 18px; }
.recs-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
.hint { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); }
.card { font: inherit; color: inherit; text-align: left; width: 100%; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 24px; align-items: start; transition: border-color .15s, transform .15s; }
.card:hover { border-color: var(--accent); }
.card .num { font-family: var(--display); font-stretch: 75%; font-weight: 800; font-size: 4.5rem; line-height: 0.85; color: var(--accent); grid-row: span 3; }
.card .body { display: grid; gap: 8px; min-width: 0; grid-row: span 3; }
.card .ctitle { font-family: var(--display); font-stretch: 85%; font-weight: 750; font-size: clamp(1.4rem, 3vw, 1.9rem); line-height: 1.05; text-wrap: balance; }
.card .ask { font-size: 1.15rem; }
.card .why { font-size: 1rem; color: var(--muted); }
.card .why b { color: var(--ink); font-weight: 600; }
.card .open { align-self: center; grid-row: span 3; font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); border: 1.5px solid var(--accent); border-radius: 999px; padding: 6px 12px; white-space: nowrap; }
.card:hover .open { background: var(--accent-soft); }
.swap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 4px; }
.swap .old { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--strike); text-decoration-thickness: 2px; }
.swap .arrow { color: var(--accent); font-weight: 700; }
.swap .new { background: var(--accent-soft); border: 1.5px solid var(--accent); border-radius: 8px; padding: 6px 12px; font-weight: 600; }

/* next */
.next { background: var(--surface); border: 2px solid var(--accent); border-radius: 16px; padding: 26px 28px; display: grid; gap: 14px; }
.next ol { margin: 0; padding-left: 1.4rem; display: grid; gap: 8px; font-size: 1.12rem; }
.next li::marker { color: var(--accent); font-family: var(--mono); font-weight: 500; }
footer { font-size: 0.85rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }

/* modal */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 50; display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { background: var(--surface); color: var(--ink); border-radius: 18px; border: 1px solid var(--line); width: min(860px, 100%); max-height: 100%; overflow-y: auto; display: grid; gap: 22px; padding: 30px; box-shadow: 0 24px 60px rgba(0,0,0,0.25); }
.m-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: start; }
.m-head .num { font-family: var(--display); font-stretch: 75%; font-weight: 800; font-size: 3.6rem; line-height: 0.85; color: var(--accent); }
.m-head .sub { color: var(--muted); font-size: 1rem; margin-top: 6px; }
.close { font: inherit; font-size: 1.5rem; line-height: 1; width: 44px; height: 44px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.close:hover { border-color: var(--accent); color: var(--accent); }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.fact { border-top: 2px solid var(--ink); padding-top: 10px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.fact .k, .block .k { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.fact p { font-size: 1rem; }
.block { display: grid; gap: 10px; }
.quote { background: var(--bg); border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; font-size: 1rem; }
.quote .k { color: var(--accent); }
.topics { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.topic { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: 2.1rem minmax(0, 1fr); gap: 2px 10px; background: var(--bg); }
.topic .n { font-family: var(--mono); font-size: 0.8rem; color: var(--accent); grid-row: span 3; padding-top: 3px; }
.topic .t { font-family: var(--display); font-stretch: 85%; font-weight: 700; font-size: 1.08rem; }
.topic .d { font-size: 0.95rem; }
.topic .w { font-size: 0.86rem; color: var(--muted); }
.note { font-size: 0.95rem; color: var(--muted); }
.steps-list { margin: 0; padding-left: 1.3rem; display: grid; gap: 6px; font-size: 1rem; }
.steps-list li::marker { color: var(--accent); font-family: var(--mono); }
.m-foot { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border-top: 1px solid var(--line); padding-top: 16px; }
.nav { display: flex; gap: 8px; }
.nav button { font: inherit; font-size: 0.92rem; font-weight: 600; color: var(--accent); background: none; border: 1.5px solid var(--accent); border-radius: 8px; padding: 7px 14px; cursor: pointer; }
.nav button:hover { background: var(--accent-soft); }
.nav button:disabled { opacity: 0.35; cursor: default; background: none; }
.m-foot .pos { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); }

@media (max-width: 820px) {
  .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .facts { grid-template-columns: 1fr; }
  .topics { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .card { padding: 20px; gap: 10px 16px; grid-template-columns: auto minmax(0, 1fr); }
  .card .num { font-size: 3.2rem; grid-row: span 1; }
  .card .body { grid-row: auto; }
  .card .open { grid-column: 2; grid-row: auto; justify-self: start; }
  .modal { padding: 20px; }
  .m-head .num { font-size: 2.6rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .modal { animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translateY(10px); opacity: 0.6; } to { transform: none; opacity: 1; } }
}

/* Site fix-ups: standalone hosting base styles and back link */
html, body { margin: 0; }
*, *::before, *::after { box-sizing: border-box; }
.backbar { max-width: var(--bbw, 1080px); margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.backbar a { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); text-decoration: none; }
.backbar a:hover { text-decoration: underline; }
</style>

<nav class="backbar" aria-label="Site"><a href="index.html">← All CAS work</a></nav>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const { useState, useEffect, useRef } = React;
const html = htm.bind(React.createElement);

const TOPICS = [
  ["Goals", "Why business events, and what success looks like in three years", "Tells advisors what to aim for"],
  ["Visitors", "Visitors by month and source market: 2024, 2025 and 2026 to date", "Shows the busy and quiet periods groups could fill"],
  ["Air", "Passengers by month, domestic and international; winter 2026–27 flights by gateway and airline", "Air sets the size and season of every event"],
  ["Hotels", "Rooms by hotel, and occupancy by month, weekdays and weekends if available", "Shows how many rooms a group can secure, and when"],
  ["Meeting space", "Meeting rooms by property, with sizes and working capacities; the bidding book", "Planners plan from working capacity, not maximums"],
  ["Groups hosted", "Groups in the last 24 months: type, size, month, origin and segment", "The best evidence of what the destination already wins"],
  ["Leads won and lost", "Requests and proposals received, won and lost, with the reasons", "Shows why planners say yes or no"],
  ["Sales activity", "Current meetings activities such as IBTM and IMEX, the team, and results so far", "Shows the starting point for any plan"],
  ["Safety", "How planners' safety questions are answered today, and by whom", "Usually the first question from international buyers"],
  ["Partners", "DMCs, AV and production, PCOs and key venues, with contacts", "Shows what the destination can deliver for a group"],
];

function Facts({ items }) {
  return html`<div class="facts">${items.map(([k, v]) => html`<div class="fact" key=${k}><span class="k">${k}</span><p>${v}</p></div>`)}</div>`;
}

const RECS = [
  {
    title: "Business overview first",
    sub: "Before the visit, and first in the room",
    card: html`<p class="ask">Shared by 10 Nov. Presented by the bureau director to open Wednesday.</p>
      <p class="why"><b>Why:</b> advisors see the destination's business before they judge it.</p>`,
    detail: html`
      <${Facts} items=${[
        ["The ask", "Overview shared with advisors by Tuesday 10 November. The bureau director presents it for 20–30 minutes at 09:00 Wednesday, before the panels."],
        ["Why it helps", "The “client's eyes” panel runs before advisors have seen Ixtapa. Visitor materials show what the destination looks like; the overview shows what it can deliver for groups."],
        ["What it needs", "The figures the team already has, plus the bidding book. Rough is fine. A blank is useful too: it shows where to focus."],
      ]} />
      <div class="quote"><span class="k">Builds on the 29 October call</span><p>Eduardo proposed combining statistics, infrastructure and meetings capabilities into one document, with PCMA Latam translating. This is that document.</p></div>
      <div class="block">
        <span class="k">What the overview covers</span>
        <ol class="topics">${TOPICS.map(([t, d, w], i) => html`<li class="topic" key=${t}><span class="n">${String(i + 1).padStart(2, "0")}</span><span class="t">${t}</span><span class="d">${d}</span><span class="w">${w}</span></li>`)}</ol>
        <p class="note">Two to four pages. Spanish or English. Recent figures are best; an estimate is fine where none exists.</p>
      </div>`,
  },
  {
    title: "Frame it as discovery",
    sub: "A strong first view, then decisions",
    card: html`<p class="ask">Outputs are a first view. Follow-up call in mid-January.</p>
      <p class="why"><b>Why:</b> first impressions become decisions, and the report gets a next step.</p>`,
    detail: html`
      <${Facts} items=${[
        ["The ask", "One line in the program describing the outputs as a first view to be tested. A one-hour virtual follow-up with the hosts in mid-January 2027, about 60 days after the visit."],
        ["Why it helps", "None of the advisors has seen the destination or run a program there. Our first view is well grounded; testing it against the destination's figures makes it reliable."],
        ["What it needs", "Agreement on a date from PCMA Latam and the hosts, and an hour of advisors' time in January."],
      ]} />
      <div class="quote"><span class="k">Builds on the 29 October call</span><p>As Lucio put it, the aim is to “identify where they are” and the “realistic fit.” The follow-up lets the destination confirm that fit with its own figures.</p></div>
      <div class="block">
        <span class="k">Suggested follow-up agenda, 60 minutes</span>
        <ol class="steps-list">
          <li>The updated business overview: what it shows</li>
          <li>Target event types: confirmed, revised or dropped</li>
          <li>The owner's progress on first target accounts</li>
          <li>The next 90 days, and what support helps most</li>
        </ol>
      </div>`,
  },
  {
    title: "A Thursday output we can finish",
    sub: "Objective 5 and the Day 3, part 2 outcome",
    card: html`<div class="swap">
        <span class="old">A pipeline of target events</span>
        <span class="arrow" aria-hidden="true">→</span>
        <span class="new">Target event types + a named owner + an updated overview in 60 days</span>
      </div>
      <p class="why"><b>Why:</b> 90 minutes can agree direction. A pipeline needs data we don't have yet.</p>`,
    detail: html`
      <div class="swap">
        <span class="old">A prioritized action plan and a pipeline of target events</span>
        <span class="arrow" aria-hidden="true">→</span>
        <span class="new">Target event types, a named owner, and an updated business overview within 60 days</span>
      </div>
      <${Facts} items=${[
        ["The ask", "Update the wording of Objective 5 and the Thursday workshop outcome to match what 90 minutes can complete."],
        ["Why it helps", "A real pipeline needs named accounts, lead data and sales capacity. The room leaves with something it has actually finished and can build on."],
        ["What it needs", "Agreement on the wording, and a volunteer owner from the host team by the end of Thursday."],
      ]} />
      <div class="block">
        <span class="k">What the named owner does by mid-January</span>
        <ol class="steps-list">
          <li>Gathers the updated business overview with hotel and airport partners</li>
          <li>Drafts a first list of target accounts for the agreed event types</li>
          <li>Reports progress at the 60-day follow-up</li>
        </ol>
      </div>
      <div class="quote"><span class="k">Fits the program's own design</span><p>The outputs table already assigns the action plan to the Ixtapa-Zihuatanejo team. A named owner from that team carries it forward.</p></div>`,
  },
];

function Modal({ index, onClose, onGo }) {
  const r = RECS[index];
  const closeRef = useRef(null);
  const boxRef = useRef(null);
  useEffect(() => {
    document.body.classList.add("locked");
    closeRef.current && closeRef.current.focus();
    if (boxRef.current) boxRef.current.scrollTop = 0;
    const onKey = e => {
      if (e.key === "Escape") onClose();
      if (e.key === "ArrowRight" && index < RECS.length - 1) onGo(index + 1);
      if (e.key === "ArrowLeft" && index > 0) onGo(index - 1);
      if (e.key === "Tab" && boxRef.current) {
        const f = boxRef.current.querySelectorAll("button:not([disabled])");
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    };
    document.addEventListener("keydown", onKey);
    return () => { document.removeEventListener("keydown", onKey); document.body.classList.remove("locked"); };
  }, [index]);
  return html`<div class="scrim" onClick=${e => { if (e.target === e.currentTarget) onClose(); }}>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title" ref=${boxRef}>
      <div class="m-head">
        <span class="num" aria-hidden="true">${index + 1}</span>
        <div><h3 id="m-title">${r.title}</h3><p class="sub">${r.sub}</p></div>
        <button class="close" type="button" aria-label="Close details" ref=${closeRef} onClick=${onClose}>×</button>
      </div>
      ${r.detail}
      <div class="m-foot">
        <span class="pos">Suggestion ${index + 1} of ${RECS.length}</span>
        <div class="nav">
          <button type="button" disabled=${index === 0} onClick=${() => onGo(index - 1)}>← Previous</button>
          <button type="button" disabled=${index === RECS.length - 1} onClick=${() => onGo(index + 1)}>Next →</button>
        </div>
      </div>
    </div>
  </div>`;
}

function App() {
  const [open, setOpen] = useState(null);
  const lastCard = useRef(null);
  const openAt = (i, el) => { lastCard.current = el; setOpen(i); };
  const close = () => { setOpen(null); setTimeout(() => lastCard.current && lastCard.current.focus(), 0); };
  return html`<main class="wrap">
    <header>
      <div class="eyebrow">PCMA CAS · Ixtapa-Zihuatanejo · 17–20 Nov 2026</div>
      <h1>Start From the Business</h1>
      <p class="thesis">Discovery first, then insight. Three small changes, no new days.</p>
      <p class="meta">Advisor suggestions for PCMA Latam · Bruce MacMillan</p>
    </header>

    <section class="seq" aria-labelledby="seq-h">
      <h2 id="seq-h">The sequence</h2>
      <ol class="steps">
        <li class="step"><span class="date">Tue 10 Nov</span><span class="what">Business overview shared</span></li>
        <li class="step"><span class="date">Wed 18 Nov · 09:00</span><span class="what">Overview opens the summit</span></li>
        <li class="step"><span class="date">Thu 19 Nov</span><span class="what">Owner and next step agreed</span></li>
        <li class="step"><span class="date">Mid-Jan 2027</span><span class="what">60-day follow-up</span></li>
      </ol>
    </section>

    <section class="recs" aria-labelledby="recs-h">
      <div class="recs-head"><h2 id="recs-h">Three suggestions</h2><span class="hint">Select a box for details</span></div>
      ${RECS.map((r, i) => html`<button class="card" type="button" key=${r.title} aria-haspopup="dialog" onClick=${e => openAt(i, e.currentTarget)}>
        <span class="num" aria-hidden="true">${i + 1}</span>
        <span class="body"><span class="ctitle">${r.title}</span>${r.card}</span>
        <span class="open">Details</span>
      </button>`)}
    </section>

    <section class="next" aria-labelledby="next-h">
      <h2 id="next-h">To agree today</h2>
      <ol>
        <li>Send the overview request this week</li>
        <li>Open Wednesday with the overview</li>
        <li>Update the Thursday output wording</li>
        <li>Hold a mid-January follow-up date</li>
      </ol>
    </section>

    <footer>Based on the Preliminary Program and the 29 October introductory call.</footer>
    ${open !== null && html`<${Modal} index=${open} onClose=${close} onGo=${setOpen} />`}
  </main>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
