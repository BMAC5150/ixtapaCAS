  const sN = nightsIntl / nightsAll, sG = sum(g11, (r) => r.foreign_guests) / sum(g11, (r) => r.total_guests);
  const stay = (sN / (1 - sN)) / (sG / (1 - sG));
  const domAir = sum(a25, (r) => r.mexico_arrivals) / sum(d25, (r) => r.resident_guests);
  const intlAir = Math.min(1, sum(a25, (r) => r.canada_arrivals + r.usa_arrivals) / sum(d25, (r) => r.foreign_guests));
  const months = d25.map((r) => {
    const a = a25.find((x) => x.month_num === r.month_num);
    const intlShare = (stay * r.foreign_guests) / (stay * r.foreign_guests + r.resident_guests);
    const airShare = Math.min(1, a.mexico_arrivals / r.resident_guests);
    const intlAir = a.canada_arrivals + a.usa_arrivals;
    return { month: r.month, month_num: r.month_num, days: r.days, occ: r.occupancy_pct, intlShare, airShare, unconfirmed: intlAir > 0 ? r.foreign_guests / intlAir > 5 : r.foreign_guests > 0 };
  });
  const low = [...months].sort((x, y) => x.occ - y.occ).slice(0, 3).map((m) => m.month);
  const lowNames = MONTHS.filter((m) => low.includes(m));
  // association floor on inventory
  const d24 = DATATUR.filter((r) => r.year === 2024);
  const b24 = ROOM_BASE.find((r) => r.year === 2024);
  const days24 = sum(d24, (r) => r.days);
  const rn24 = b24.occupied * days24, g24 = sum(d24, (r) => r.total_guests), g25 = sum(d25, (r) => r.total_guests);
  // regions
  const regions = [];
  ORIGIN.forEach((r) => {
    let g = regions.find((x) => x.region === r.region && x.market === r.market);
    if (!g) { g = { region: r.region, market: r.market, nights: 0 }; regions.push(g); }
    g.nights += r.nights;
  });
  regions.sort((a, b) => (MARKET_ORDER.indexOf(a.market) - MARKET_ORDER.indexOf(b.market)) || (b.nights - a.nights));
  const markets = MARKET_ORDER.map((m) => ({ market: m, nights: sum(ORIGIN.filter((r) => r.market === m), (r) => r.nights) })).filter((m) => m.nights > 0);
  // peaks
  const top3 = (rows, f) => [...rows].sort((x, y) => f(y) - f(x)).slice(0, 3).map((r) => r.month_num).sort((x, y) => x - y).map((n) => MONTHS[n - 1]).join(', ');
  const caOn = MONTHS.map((_, i) => { const r = a25.find((x) => x.month_num === i + 1); return r ? r.canada_arrivals > 0 : false; });
  const caStart = caOn.findIndex((v, i) => v && !caOn[(i + 11) % 12]);
  let caEnd = caStart; while (caOn[(caEnd + 1) % 12] && (caEnd + 1) % 12 !== caStart) caEnd = (caEnd + 1) % 12;
  const oct = { fg: d25.find((r) => r.month === 'Oct').foreign_guests, us: a25.find((r) => r.month === 'Oct').usa_arrivals, ca: a25.find((r) => r.month === 'Oct').canada_arrivals };
  return { months, stay, sN, sG, domAir, intlAir, lowNames, nightsAll, b24, days24, rn24, g24, g25, regions, markets, top3, caSpan: MONTHS[caStart] + ' to ' + MONTHS[caEnd] + ' only', a25, oct };
})();

function model(rooms) {
  const m = BASE.months.map((x) => {
    const cap = rooms * x.days, sold = cap * (x.occ / 100);
    const intl = sold * x.intlShare, dom = sold - intl;
    return { ...x, cap, sold, unsold: cap - sold, intl, dom, domAir: dom * x.airShare, domRoad: dom * (1 - x.airShare) };
  });
  const sold = sum(m, (x) => x.sold), dom = sum(m, (x) => x.dom), road = sum(m, (x) => x.domRoad), intl = sold - dom;
  const lowUnsold = sum(m.filter((x) => BASE.lowNames.includes(x.month)), (x) => x.unsold);
  const groupRn = GROUP.rooms * GROUP.nights;
  const domPeak = BASE.top3(m, (x) => x.dom);
  const usPeak = BASE.top3(BASE.a25, (x) => x.usa_arrivals);
  const info = {
    Mexico: { access: 'Road, at least ' + Math.round(100 - BASE.domAir * 100) + '%', peak: domPeak },
    'United States': { access: 'Air, direct winter flights', peak: usPeak },
    Canada: { access: 'Air, direct winter flights', peak: 'Flights ' + BASE.caSpan },
  };
  const segments = BASE.regions.map((g) => {
    const rn = r100((g.nights / BASE.nightsAll) * sold);
    return { ...g, share: (g.nights / BASE.nightsAll) * 100, rn, group: rn > 0 ? (groupRn / rn) * 100 : null, ...(info[g.market] || { access: 'No data', peak: 'No data' }) };
  });
  const markets = BASE.markets.map((x) => ({ ...x, share: (x.nights / BASE.nightsAll) * 100, rn: r100((x.nights / BASE.nightsAll) * sold) }));
  const modes = [
    { mode: 'Domestic, by road', rn: road, color: 'var(--c0)', op: 1 },
    { mode: 'Domestic, by air', rn: dom - road, color: 'var(--c3)', op: 1 },
    { mode: 'International, direct flight', rn: intl * BASE.intlAir, color: 'var(--c1)', op: 1 },
    { mode: 'International, other routes', rn: intl * (1 - BASE.intlAir), color: 'var(--c4)', op: 1 },
  ].map((x) => ({ ...x, share: (x.rn / sold) * 100, rn: r100(x.rn) }));
  const cover = (BASE.nightsAll / sum(m.filter((x) => x.month_num <= 11), (x) => x.sold)) * 100;
  return { cover, rnPerGuest: sold / BASE.g25, months: m, sold: r100(sold), domShare: (dom / sold) * 100, intlShare: (intl / sold) * 100, roadShare: (road / sold) * 100, lowUnsold: r100(lowUnsold), segments, markets, modes, groupRn };
}

// ---------- small hooks ----------
function useWidth(fallback = 640) {
  const ref = useRef(null);
  const [w, setW] = useState(fallback);
  useEffect(() => {
    if (!ref.current) return;
    const ro = new ResizeObserver((e) => setW(Math.max(260, Math.floor(e[0].contentRect.width))));
    ro.observe(ref.current);
    return () => ro.disconnect();
  }, []);
  return [ref, w];
}
function useTip() {
  const box = useRef(null);
  const [tip, setTip] = useState(null);
  const show = useCallback((ev, lines) => {
    const r = box.current.getBoundingClientRect();
    let x = ev.clientX - r.left + 12, y = ev.clientY - r.top + 12;
    if (x + 250 > r.width) x = Math.max(0, ev.clientX - r.left - 250);
    setTip({ x, y, lines });
  }, []);
  const hide = useCallback(() => setTip(null), []);
  const node = tip && html`<div class="tip" style=${{ left: tip.x + 'px', top: tip.y + 'px' }}>${tip.lines.map((l, i) => html`<div key=${i}>${i === 0 ? html`<b>${l}</b>` : l}</div>`)}</div>`;
  return { box, show, hide, node };
}

// ---------- pieces ----------
function Stack({ items, label }) {
  const t = useTip();
  return html`<div class="chart" ref=${t.box}>
    <div class="stack" role="img" aria-label=${label + ': ' + items.map((i) => i.name + ' ' + fPct(i.share)).join(', ')}>
      ${items.map((i) => html`<div key=${i.name} style=${{ flex: Math.max(i.share, 0.3), background: i.color }}
        onPointerMove=${(e) => t.show(e, [i.name, fPct(i.share) + ' of room nights', fInt(i.rn) + ' room nights'])} onPointerLeave=${t.hide}></div>`)}
    </div>
    ${t.node}
  </div>`;
}

function Legend({ items }) {
  return html`<ul class="legend">${items.map((i) => html`<li key=${i.name}>
    <span class="sw" style=${{ background: i.color }}></span><span>${i.name}</span>
    <span class="v">${fPct(i.share)}</span><span class="v2">${fInt(i.rn)}</span></li>`)}</ul>`;
}

function RegionBars({ segs }) {
  const t = useTip();
  const max = Math.max(...segs.map((s) => s.rn), 1);
  let last = null;
  const out = [];
  segs.forEach((s) => {
    if (s.market !== last) { out.push(html`<div class="grp" key=${'g' + s.market}>${s.market}</div>`); last = s.market; }
    out.push(html`<div class="bar" key=${s.market + s.region}
      onPointerMove=${(e) => t.show(e, [s.region + ' (' + s.market + ')', fInt(s.rn) + ' room nights', fPct(s.share) + ' of all room nights', fInt(s.nights) + ' association nights, Jan to Nov'])} onPointerLeave=${t.hide}>
      <span class="lab">${s.region}</span>
      <span class="track"><span class="fill" style=${{ width: 'calc((100% - 8.5em) * ' + Math.max(0.004, s.rn / max).toFixed(4) + ')', background: mcolor(s.market) }}></span>
      <span class="val">${fInt(s.rn)} · ${fPct(s.share)}</span></span></div>`);
  });
  return html`<div class="chart" ref=${t.box}><div class="bars" role="img" aria-label=${'Room nights by region of origin: ' + segs.map((s) => s.region + ' ' + fPct(s.share)).join(', ')}>${out}</div>${t.node}</div>`;
}

function AirMonths({ months }) {
  const [ref, W] = useWidth(340);
  const t = useTip();
  const H = 160, mt = 20, mb = 24;
  const n = months.length, band = W / n, bw = band * 0.72;
  const max = Math.max(30, ...months.map((m) => m.airShare * 100));
  const y = (v) => H - mb - (v / max) * (H - mt - mb);
  return html`<div class="chart" ref=${(el) => { ref.current = el; t.box.current = el; }}>
    <svg viewBox=${`0 0 ${W} ${H}`} width="100%" height=${H} role="img" aria-label=${'Domestic air share by month, 2025: ' + months.map((m) => m.month + ' ' + fPct(m.airShare * 100, 0)).join(', ')}>
      ${months.map((m, i) => {
        const v = m.airShare * 100, x = i * band + (band - bw) / 2;
        return html`<g key=${m.month} onPointerMove=${(e) => t.show(e, [m.month + ' 2025', fPct(v) + ' arrived by domestic flight', fPct(100 - v) + ' did not'])} onPointerLeave=${t.hide}>
          <rect x=${x} y=${y(v)} width=${bw} height=${y(0) - y(v)} rx="2" style=${{ fill: 'var(--c3)' }}></rect>
          ${bw > 16 && html`<text x=${x + bw / 2} y=${y(v) - 5} text-anchor="middle" font-size="12">${Math.round(v)}</text>`}
          <text x=${x + bw / 2} y=${H - 6} text-anchor="middle" font-size="12">${bw > 18 ? m.month : m.month[0]}</text>
        </g>`;
      })}
    </svg>${t.node}</div>`;
}

function SeasonBars({ months }) {
  const [ref, W] = useWidth(700);
  const t = useTip();
  const H = 320, mt = 24, mb = 26, ml = 44, mr = 6;
  const maxCap = Math.max(...months.map((m) => m.cap));
  const step = maxCap > 150000 ? 50000 : 25000;
  const top = Math.ceil(maxCap / step) * step;
  const ticks = []; for (let v = 0; v <= top; v += step) ticks.push(v);
  const y = (v) => H - mb - (v / top) * (H - mt - mb);
  const band = (W - ml - mr) / months.length, bw = band * 0.74;
  const fk = (v) => (v === 0 ? '0' : Math.round(v / 1000) + 'k');
  return html`<div class="chart" ref=${(el) => { ref.current = el; t.box.current = el; }}>
    <svg viewBox=${`0 0 ${W} ${H}`} width="100%" height=${H} role="img" aria-label=${'Room nights by month, 2025: domestic, international and unsold. Occupancy ' + months.map((m) => m.month + ' ' + fPct(m.occ, 0)).join(', ')}>
      ${ticks.map((v) => html`<g key=${v}><line class="gl" x1=${ml} x2=${W - mr} y1=${y(v)} y2=${y(v)}></line><text x=${ml - 6} y=${y(v) + 4} text-anchor="end" font-size="12">${fk(v)}</text></g>`)}
      ${months.map((m, i) => {
        const x = ml + i * band + (band - bw) / 2;
        return html`<g key=${m.month} onPointerMove=${(e) => t.show(e, [m.month + ' 2025 · ' + fPct(m.occ) + ' occupancy', 'Domestic: ' + fInt(m.dom), 'International: ' + fInt(m.intl) + (m.unconfirmed ? ' (unconfirmed)' : ''), 'Unsold: ' + fInt(m.unsold)])} onPointerLeave=${t.hide}>
          <rect x=${x} y=${y(m.dom)} width=${bw} height=${y(0) - y(m.dom)} style=${{ fill: 'var(--c0)' }}></rect>
          <rect x=${x} y=${y(m.dom + m.intl)} width=${bw} height=${y(m.dom) - y(m.dom + m.intl)} style=${m.unconfirmed ? { fill: 'var(--c1)', stroke: 'var(--warn)', strokeWidth: 2, strokeDasharray: '3 2' } : { fill: 'var(--c1)' }}></rect>
          <rect x=${x} y=${y(m.cap)} width=${bw} height=${y(m.sold) - y(m.cap)} style=${{ fill: 'var(--cm)', opacity: 0.4 }}></rect>
          ${bw > 22 && html`<text x=${x + bw / 2} y=${y(m.sold) - 5} text-anchor="middle" font-size="12" style=${{ fill: 'var(--ink)' }}>${Math.round(m.occ)}%${m.unconfirmed ? '*' : ''}</text>`}
          <text x=${x + bw / 2} y=${H - 7} text-anchor="middle" font-size="12">${bw > 18 ? m.month : m.month[0]}</text>
        </g>`;
      })}
    </svg>${t.node}</div>`;
}

function OccLines() {
  const [ref, W] = useWidth(700);
  const t = useTip();
  const H = 210, mt = 12, mb = 26, ml = 40, mr = 12;
  const years = [[2024, 'var(--c2)'], [2025, 'var(--c0)'], [2026, 'var(--c1)']];
  const lo = 40, hi = 75;
  const x = (i) => ml + (i + 0.5) * ((W - ml - mr) / 12);
  const y = (v) => H - mb - ((v - lo) / (hi - lo)) * (H - mt - mb);
  const onMove = (e) => {
    const r = e.currentTarget.ownerSVGElement.getBoundingClientRect();
    const px = ((e.clientX - r.left) / r.width) * W;
    let i = Math.round((px - ml) / ((W - ml - mr) / 12) - 0.5); i = Math.max(0, Math.min(11, i));
    t.show(e, [MONTHS[i], ...years.map(([yr]) => { const d = DATATUR.find((q) => q.year === yr && q.month_num === i + 1); return yr + ': ' + (d ? fPct(d.occupancy_pct) : 'no data yet'); })]);
  };
  return html`<div class="chart" ref=${(el) => { ref.current = el; t.box.current = el; }}>
    <svg viewBox=${`0 0 ${W} ${H}`} width="100%" height=${H} role="img" aria-label="Monthly hotel occupancy, 2024, 2025 and 2026 to August">
      ${[40, 50, 60, 70].map((v) => html`<g key=${v}><line class="gl" x1=${ml} x2=${W - mr} y1=${y(v)} y2=${y(v)}></line><text x=${ml - 6} y=${y(v) + 4} text-anchor="end" font-size="12">${v}%</text></g>`)}
      ${MONTHS.map((m, i) => html`<text key=${m} x=${x(i)} y=${H - 7} text-anchor="middle" font-size="12">${W > 440 ? m : m[0]}</text>`)}
      ${years.map(([yr, c]) => {
        const pts = DATATUR.filter((r) => r.year === yr).sort((a, b) => a.month_num - b.month_num);
        const d = pts.map((p, k) => (k ? 'L' : 'M') + x(p.month_num - 1) + ',' + y(p.occupancy_pct)).join('');
        return html`<g key=${yr}><path d=${d} fill="none" style=${{ stroke: c }} stroke-width=${yr === 2025 ? 2.6 : 1.8}></path>
          ${pts.map((p) => html`<circle key=${p.month_num} cx=${x(p.month_num - 1)} cy=${y(p.occupancy_pct)} r="2.8" style=${{ fill: c }}></circle>`)}</g>`;
      })}
      <rect x=${ml} y=${mt} width=${W - ml - mr} height=${H - mt - mb} fill="transparent" onPointerMove=${onMove} onPointerLeave=${t.hide}></rect>
    </svg>${t.node}</div>`;
}

function SegTable({ segs, groupRn }) {
  let last = null;
  return html`<div class="tablewrap"><table>
    <thead><tr><th scope="col">Segment</th><th scope="col">Market</th><th class="n" scope="col">Share of room nights</th><th class="n" scope="col">Room nights, 2025</th><th class="n" scope="col">One group adds</th><th scope="col">Main way in</th><th scope="col">Peak months</th></tr></thead>
    <tbody>${segs.map((s) => {
      const mk = last !== null && s.market !== last; last = s.market;
      return html`<tr key=${s.market + s.region} class=${mk ? 'mk' : ''}>
        <td>${s.region}</td><td>${s.market}</td><td class="n">${fPct(s.share)}</td><td class="n">${fInt(s.rn)}</td>
        <td class=${'n' + (s.group >= 10 ? ' hi' : '')}>${s.group == null ? '—' : fPct(s.group, s.group < 1 ? 2 : 0)}</td><td>${s.access}</td><td>${s.peak}</td></tr>`;
    })}</tbody></table></div>`;
}

      <summary>How the room nights are estimated, and what to check</summary>
      <ul>
        <li><b>Room nights sold</b> = rooms × days in the month × Datatur monthly occupancy (2025), summed. The result matches Datatur's published annual occupancy to within a tenth of a point.</li>
        <li><b>Room inventory</b> is Datatur's own room base, the same base its occupancy rates are calculated on. The figures come from secondary citations of Sectur's annual results; the Datatur table itself could not be retrieved, so they are reported, not verified.</li>
        <li><b>Cross-check.</b> Sectur's 2024 figure of <b>${fInt(BASE.b24.occupied)}</b> rooms occupied a day, over <b>${BASE.days24}</b> days, gives <b>${fInt(BASE.rn24)}</b> room nights. The destination file counts <b>${fInt(BASE.g24)}</b> hotel guests in 2024: <b>${(BASE.rn24 / BASE.g24).toFixed(2)}</b> room nights per guest. The default gives <b>${all.mid.rnPerGuest.toFixed(2)}</b> for 2025, so the two sources agree.</li>
        <li><b>Origin</b> comes from the hotel association, as shares only. Its <b>${fInt(BASE.nightsAll)}</b> nights booked in January to November 2025 equal about <b>${fPct(all.mid.cover, 0)}</b> of the default's room nights for those months, so its coverage is partial and its unit is still to be confirmed. Shares are applied to the full year.</li>
        <li><b>Domestic versus international</b> by month uses Datatur's guest mix, weighted by a stay factor: international guests account for <b>${fPct(BASE.sN * 100)}</b> of association nights but <b>${fPct(BASE.sG * 100)}</b> of Datatur guests, so each international guest is weighted as <b>${BASE.stay.toFixed(2)}</b> domestic guests.</li>
        <li><b>Way of arrival.</b> Domestic air share = AFAC domestic arrivals ÷ Datatur domestic guests. AFAC counts every passenger, including residents and guests outside hotels, so the air share is a ceiling and the road share a floor. International direct air = AFAC Canada and U.S. arrivals ÷ Datatur foreign guests (<b>${fPct(BASE.intlAir * 100)}</b> for the year). The rest arrive by domestic connection or road.</li>
        <li><span class="flag">To check with Datatur:</span> in December to March, international air arrivals exceed foreign hotel guests, and from May to October the reverse holds, most sharply in October. Two hypotheses: winter visitors stay more often in condos and timeshares, and summer “foreign” guests include Mexicans living abroad who arrive through Mexico City or by road. The annual split is unaffected.</li>
        <li><b>Not in the data:</b> the split between group and leisure room nights, weekday versus weekend, ADR and RevPAR. Every segment here is mostly leisure until a group field exists.</li>
      </ul>
    </details>

    <footer>
      <span>Sources: destination data file of 3 Nov 2026 (Datatur hotel guests and occupancy; AFAC air arrivals), canonical where sources conflict; CVB statistical data received 9 Nov 2026 (Ixtapa-Zihuatanejo Hotel Association guest origin, January to November 2025). Room base: Sectur annual hotel results for 2023 and 2024 (as cited on Wikipedia) and Datatur 2020 (via a Sinaloa state report). An unsourced 68.9% occupancy for 2025 in a Monex note matches January 2025 only and is not used.</span>
      <span>Prepared for the PCMA Customer Advisory Summit, Ixtapa-Zihuatanejo, 17 to 20 November 2026. Updated 10 Nov 2026. Totals, segment sizes and travel splits are estimates until the destination confirms its 2025 room base and shares group data.</span>
    </footer>
  </main>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
